name: news_podcast_app
description: PodAI — podcasts de ~2 minutos gerados a partir de notícias publicadas nas últimas 72 horas.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  xml: ^6.5.0
  flutter_tts: ^4.0.2
  # flutter_localizations fixa a versão do intl; "any" evita conflito entre versões do Flutter.
  intl: any
  shared_preferences: ^2.3.2
  provider: ^6.1.2
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/podai_icon.png

# Ícone do app (Android + iOS). Gerar com:  dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/icon/podai_icon.png
  adaptive_icon_background: '#2E1065'
  adaptive_icon_foreground: assets/icon/podai_icon.png
  min_sdk_android: 21
